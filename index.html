<style>
/* Layout: one phone-width column — stage (video + overlay) on top, controls, then the rep log like a training notebook. */

  }
}

  --accent: #3fb47a; --accent-ink: #06130c; --good: #47c27f; --warn: #e0a640; --bad: #ef6b6b; --stage: #050807;

}

  overflow: hidden; text-overflow: ellipsis; pointer-events: none; }

  background: var(--surface); color: var(--ink); cursor: pointer; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; }
button.primary, .filebtn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, .filebtn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }

@media (max-width: 420px) { .hud .count { font-size: 38px; } .stat .v { font-size: 28px; } }

<div class="wrap">
  <header>
    <h1>伏地挺身教練</h1>

  </header>

  <div class="stage" id="stage">

    <canvas id="overlay"></canvas>
    <div class="empty" id="empty">
      <div>

          <line x1="10" y1="72" x2="190" y2="72" stroke="#5d6b63" stroke-width="2"/>

          <polyline points="150,40 152,56 150,70" fill="none" stroke="#7fb8ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="160" cy="34" r="8" fill="#c9d4cd"/>
          <rect x="4" y="4" width="34" height="22" rx="4" fill="none" stroke="#c9d4cd" stroke-width="2"/>
          <circle cx="21" cy="15" r="5" fill="none" stroke="#c9d4cd" stroke-width="2"/>
        </svg>

      </div>
    </div>

  <div class="opts">

  <div class="tips">
    判斷標準
    <ul>
      <li>下壓深度：最低點手肘 ≤ 90°（90–105° 略淺）</li>
      <li>頂端伸直：手肘 ≥ 155°</li>
      <li>身體直線：肩-髖-踝 ≥ 165°（低於 155° 為明顯塌腰或翹臀）</li>
      <li>節奏：一下至少 0.8 秒</li>
    </ul>
  </div>
</div>

<script>
// 載入診斷：在主程式之前執行，任何被擋下的檔案或錯誤都會顯示在畫面上
(function () {
  var problems = [];
  window.__problems = problems;
  function show() {
    var el = document.getElementById("status");
    if (!el || window.__ready) return;
    el.classList.add("err");
    el.textContent = "載入失敗：" + problems.slice(-3).join("；") + "。請截圖給我。";
  }
  window.__showProblems = show;
  document.addEventListener("securitypolicyviolation", function (e) {
    problems.push("頁面安全設定擋下 " + (e.blockedURI || "inline") + "（" + e.effectiveDirective + "）");
  });
  window.addEventListener("error", function (e) { problems.push(String(e.message || e.type)); });
  window.addEventListener("unhandledrejection", function (e) { problems.push(String((e.reason && e.reason.message) || e.reason)); });
  if (typeof WebAssembly !== "object") problems.push("這個瀏覽器不支援 WebAssembly");
  setTimeout(function () {
    if (window.__ready) return;
    if (problems.length) show();
    else if (!window.__moduleStarted) {
      var el = document.getElementById("status");
      el.classList.add("err");
      el.textContent = "主程式沒有啟動（可能被頁面安全設定擋下）。請截圖給我。";
    }
  }, 20000);
})();
</script>

<script type="module">
window.__moduleStarted = true;
let FilesetResolver, PoseLandmarker, bundleSource = "";

// ---------- 判斷門檻（與電腦版相同） ----------
const TH = {
  topAngle: 145, startDescent: 135, minRepDepth: 140, minRepRange: 30,
  depthGood: 90, depthOk: 105, lockoutGood: 155, bodyGood: 165, bodyBad: 155,
  plankMaxTilt: 40, minVisibility: 0.5, tooFastSec: 0.8, armSupport: 0.6,
};
const L = { shoulder: 11, elbow: 13, wrist: 15, hip: 23, knee: 25, ankle: 27 };
const R = { shoulder: 12, elbow: 14, wrist: 16, hip: 24, knee: 26, ankle: 28 };

const $ = (id) => document.getElementById(id);
const video = $("video"), canvas = $("overlay"), ctx = canvas.getContext("2d");
const statusEl = $("status");

function setStatus(msg, err = false) { statusEl.textContent = msg; statusEl.classList.toggle("err", err); }

// ---------- 幾何 ----------
function angleAt(a, b, c) {
  const bax = a[0] - b[0], bay = a[1] - b[1], bcx = c[0] - b[0], bcy = c[1] - b[1];
  const d = Math.hypot(bax, bay) * Math.hypot(bcx, bcy);
  if (d < 1e-6) return NaN;
  return Math.acos(Math.max(-1, Math.min(1, (bax * bcx + bay * bcy) / d))) * 180 / Math.PI;
}
function hipOffset(s, h, a) {
  const lx = a[0] - s[0], ly = a[1] - s[1], len2 = lx * lx + ly * ly;
  if (len2 < 1e-6) return NaN;
  const t = ((h[0] - s[0]) * lx + (h[1] - s[1]) * ly) / len2;
  const px = s[0] + t * lx, py = s[1] + t * ly;
  const d = Math.hypot(h[0] - px, h[1] - py) / Math.sqrt(len2);
  return h[1] > py ? d : -d;
}
const tilt = (p1, p2) => Math.atan2(Math.abs(p2[1] - p1[1]), Math.abs(p2[0] - p1[0]) + 1e-6) * 180 / Math.PI;
const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
const median = (arr) => { const v = arr.filter((x) => !Number.isNaN(x)).sort((a, b) => a - b); return v.length ? v[Math.floor(v.length / 2)] : NaN; };
const pct = (arr, p) => { const v = [...arr].sort((a, b) => a - b); return v[Math.min(v.length - 1, Math.floor((v.length - 1) * p))]; };

// ---------- 分析器（逐格餵入，即時與影片共用） ----------
class Analyzer {
  constructor(onRep) { this.onRep = onRep; this.win = 5; this.reset(); }
  reset(win = 5) {
    this.win = win;
    this.frames = []; this.reps = []; this.hist = { elbow: [], body: [], offset: [], support: [] };
    this.state = "unknown"; this.cur = null; this.lastTop = NaN; this.topT = 0; this.pending = null;
  }
  push(t, lms, W, H) {
    const f = { t, pts: null, inPlank: false, elbow: NaN, body: NaN, offset: NaN, support: NaN };
    if (lms) {
      const vis = (i) => lms[i].visibility ?? 0;
      const sl = Object.values(L).reduce((s, i) => s + vis(i), 0), sr = Object.values(R).reduce((s, i) => s + vis(i), 0);
      const ids = sl >= sr ? L : R;
      const core = ["shoulder", "elbow", "wrist", "hip", "ankle"].map((k) => ids[k]);
      if (Math.min(...core.map(vis)) >= TH.minVisibility * 0.6) {
        const p = {}; for (const [k, i] of Object.entries(ids)) p[k] = [lms[i].x * W, lms[i].y * H];
        f.pts = p;
        const elbow = angleAt(p.shoulder, p.elbow, p.wrist), body = angleAt(p.shoulder, p.hip, p.ankle);
        const arm = dist(p.shoulder, p.elbow) + dist(p.elbow, p.wrist);
        f.rawElbow = elbow; f.rawBody = body;
        f.inPlank = tilt(p.shoulder, p.ankle) < TH.plankMaxTilt && body >= 120;
        if (f.inPlank) {
          f._e = elbow; f._b = body; f._o = hipOffset(p.shoulder, p.hip, p.ankle);
          f._s = arm > 1 ? (p.wrist[1] - p.shoulder[1]) / arm : NaN;
        }
      }
    }
    // 最近 5 格中位數平滑
    for (const [k, src] of [["elbow", "_e"], ["body", "_b"], ["offset", "_o"], ["support", "_s"]]) {
      const h = this.hist[k]; h.push(f.inPlank ? f[src] : NaN); if (h.length > this.win) h.shift();
      f[k] = f.inPlank ? median(h) : NaN;
    }
    this.frames.push(f); f.state = this.state;
    this.step(f);
    return f;
  }
  step(f) {
    const e = f.elbow, t = f.t;
    // 頂端角度：完成後 0.6 秒內持續更新
    if (this.pending) {
      const r = this.pending;
      if (!Number.isNaN(e) && e >= r.topEndRaw - 0.5 && t - r.endT < 0.6) { r.topEndRaw = Math.max(r.topEndRaw, e); r.topElbowEnd = r.topEndRaw; grade(r); }
      else this.pending = null;
    }
    if (Number.isNaN(e)) {
      if (this.cur && t - this.cur.lastValidT > 1.0) { this.cur = null; this.state = "unknown"; }
      return;
    }
    const atTop = e >= TH.topAngle && !Number.isNaN(f.support) && f.support >= TH.armSupport;
    if (this.state === "unknown" || this.state === "top") {
      if (atTop) {
        this.lastTop = (this.state !== "top" || Number.isNaN(this.lastTop)) ? e : Math.max(this.lastTop, e);
        this.state = "top"; this.topT = t;
      } else if (this.state === "top" && e < TH.startDescent) {
        this.state = "down";
        this.cur = { startT: this.topT, topStart: this.lastTop, min: e, minT: t, body: [], off: [], lastValidT: t };
      }
    }
    if (this.state === "down") {
      const c = this.cur; c.lastValidT = t;
      if (e < c.min) { c.min = e; c.minT = t; }
      if (!Number.isNaN(f.body)) { c.body.push(f.body); c.off.push(f.offset); }
      if (atTop) {
        // 下壓幅度用「開始時的頂端角度 - 最低點」判斷（回到頂端的角度之後 0.6 秒內還會更新）
        if (c.min <= TH.minRepDepth && c.topStart - c.min >= TH.minRepRange && c.body.length) {
          const r = {
            index: this.reps.length + 1, startT: c.startT, bottomT: c.minT, endT: t, minElbow: c.min,
            topElbowStart: c.topStart, topElbowEnd: e, topEndRaw: e, minBody: pct(c.body, 0.1),
            maxSag: Math.max(0, ...c.off), maxPike: Math.max(0, ...c.off.map((x) => -x)),
          };
          grade(r); this.reps.push(r); this.pending = r; this.onRep?.(r);
        }
        this.state = "top"; this.cur = null; this.lastTop = e; this.topT = t;
      }
    }
  }
}

function grade(r) {
  const issues = []; let score = 100; const tags = [];
  if (r.minElbow > TH.depthOk) { issues.push(`下壓太淺（手肘最小 ${r.minElbow.toFixed(0)}°）`); score -= 35; tags.push("shallow"); }
  else if (r.minElbow > TH.depthGood) { issues.push(`下壓略淺（手肘最小 ${r.minElbow.toFixed(0)}°）`); score -= 15; tags.push("shallow"); }
  const top = Math.min(r.topElbowStart, r.topElbowEnd);
  if (top < TH.lockoutGood) { issues.push(`頂端手臂沒有完全伸直（${top.toFixed(0)}°）`); score -= 15; tags.push("lockout"); }
  if (r.minBody < TH.bodyGood) {
    const sag = r.maxSag >= r.maxPike; const level = r.minBody < TH.bodyBad ? "明顯" : "輕微";
    issues.push(`${level}${sag ? "塌腰（髖部下沉）" : "翹臀（髖部太高）"}，身體最彎 ${r.minBody.toFixed(0)}°`);
    score -= level === "明顯" ? 30 : 12; tags.push(sag ? "sag" : "pike");
  }
  const dur = r.endT - r.startT;
  if (dur < TH.tooFastSec) { issues.push(`速度太快（${dur.toFixed(1)} 秒）`); score -= 10; tags.push("fast"); }
  r.issues = issues; r.tags = tags; r.score = Math.max(0, score);
  r.verdict = r.score >= 85 ? "良好" : r.score >= 60 ? "尚可" : "需改進";
}

// ---------- 畫面 ----------
const COLORS = { good: "#3fcf7f", warn: "#f0b445", bad: "#ff5c5c", arm: "#7fb8ff", white: "#ffffff", grey: "#9aa9a0" };
function bodyColor(b) { return Number.isNaN(b) ? COLORS.grey : b >= TH.bodyGood ? COLORS.good : b >= TH.bodyBad ? COLORS.warn : COLORS.bad; }

function draw(f, W, H) {
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
  ctx.clearRect(0, 0, W, H);
  const s = Math.max(1, Math.min(W, H) / 540);
  if (f && f.pts) {
    const p = f.pts, b = f.inPlank ? f.body : f.rawBody;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 1.5 * s;
    ctx.beginPath(); ctx.moveTo(...p.shoulder); ctx.lineTo(...p.ankle); ctx.stroke();
    ctx.strokeStyle = bodyColor(b); ctx.lineWidth = 5 * s;
    ctx.beginPath(); ctx.moveTo(...p.shoulder); ctx.lineTo(...p.hip); ctx.lineTo(...p.knee); ctx.lineTo(...p.ankle); ctx.stroke();
    ctx.strokeStyle = COLORS.arm;
    ctx.beginPath(); ctx.moveTo(...p.shoulder); ctx.lineTo(...p.elbow); ctx.lineTo(...p.wrist); ctx.stroke();
    ctx.fillStyle = COLORS.white;
    for (const k of ["shoulder", "elbow", "wrist", "knee", "ankle"]) { ctx.beginPath(); ctx.arc(...p[k], 5 * s, 0, 7); ctx.fill(); }
    ctx.fillStyle = bodyColor(b); ctx.beginPath(); ctx.arc(...p.hip, 9 * s, 0, 7); ctx.fill();
  }
}

function hud(f, count) {
  $("hud").hidden = false;
  $("hudCount").textContent = count;
  $("hudElbow").textContent = f && !Number.isNaN(f.elbow) ? `${f.elbow.toFixed(0)}°` : "--";
  const b = f ? f.body : NaN;
  const bodyEl = $("hudBody"); bodyEl.textContent = Number.isNaN(b) ? "--" : `${b.toFixed(0)}°`; bodyEl.style.color = bodyColor(b);
  let st = "姿勢正常";
  if (!f || !f.pts) st = "找不到人";
  else if (!f.inPlank) st = "未在伏地挺身姿勢";
  else if (!Number.isNaN(b) && b < TH.bodyGood) st = f.offset > 0 ? "塌腰" : "翹臀";
  $("hudState").textContent = st;
}

let toastTimer;
function toast(r) {
  const el = $("toast");
  el.textContent = `第 ${r.index} 下：${r.verdict}${r.issues.length ? "・" + r.issues[0].split("（")[0] : ""}`;
  el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 1800);
}

// ---------- 語音 ----------
function speak(text) {
  if (!$("voice").checked || !("speechSynthesis" in window)) return;
  try { const u = new SpeechSynthesisUtterance(text); u.lang = "zh-TW"; u.rate = 1.15; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch {}
}
const CUE = { sag: "屁股不要塌", pike: "屁股放低", shallow: "再低一點", lockout: "手臂打直", fast: "慢一點" };
function cueFor(r) { return r.tags.length ? `${r.index}，${CUE[r.tags[0]]}` : `${r.index}`; }

// ---------- 結果 ----------
function renderResult(reps) {
  $("result").hidden = false;
  const good = reps.filter((r) => r.verdict === "良好").length;
  $("sReps").textContent = reps.length; $("sGood").textContent = good;
  $("sAvg").textContent = reps.length ? (reps.reduce((s, r) => s + r.score, 0) / reps.length).toFixed(0) : "0";
  const counter = new Map();
  for (const r of reps) for (const i of r.issues) { const k = i.split("（")[0].split("，")[0]; counter.set(k, (counter.get(k) || 0) + 1); }
  const list = $("issues"); list.replaceChildren();
  [...counter.entries()].sort((a, b) => b[1] - a[1]).forEach(([k, n]) => { const li = document.createElement("li"); li.textContent = `${k}：${n} 下`; list.append(li); });
  $("issueBox").hidden = counter.size === 0;
  const box = $("reps"); box.replaceChildren();
  if (!reps.length) { const p = document.createElement("p"); p.className = "sub"; p.textContent = "沒有偵測到完整的伏地挺身。請確認是側拍、全身入鏡。"; box.append(p); }
  for (const r of reps) {
    const row = document.createElement("div"); row.className = "rep";
    const n = document.createElement("div"); n.className = "n"; n.textContent = r.index;
    const d = document.createElement("div"); d.className = "d";
    const nums = document.createElement("div"); nums.className = "nums";
    nums.textContent = `${r.startT.toFixed(1)}–${r.endT.toFixed(1)} 秒 · 手肘 ${r.minElbow.toFixed(0)}° · 身體 ${r.minBody.toFixed(0)}°`;
    const iss = document.createElement("div"); iss.textContent = r.issues.length ? r.issues.join("；") : "動作標準";
    d.append(nums, iss);
    const pill = document.createElement("span"); pill.className = "pill " + (r.verdict === "良好" ? "good" : r.verdict === "尚可" ? "ok" : "bad");
    pill.textContent = `${r.verdict} ${r.score}`;
    row.append(n, d, pill); box.append(row);
  }
  window.__frames = analyzer.frames.map(f => [f.t.toFixed(2), Math.round(f.elbow), +(f.support||0).toFixed(2), Math.round(f.body), f.state, f.inPlank]);
  window.__pushupResult = reps.map(({ index, minElbow, minBody, score, verdict, issues }) => ({ index, minElbow, minBody, score, verdict, issues }));
}

// ---------- 模型 ----------
let landmarker = null, mode = "idle", lastTs = -1, tsBase = 0, liveStream = null;
async function load() {
  setStatus("載入程式（1/2）…");
  const m = await import("./vision_bundle.js");
  FilesetResolver = m.FilesetResolver; PoseLandmarker = m.PoseLandmarker;
  setStatus("下載並啟動姿勢模型（2/2）…第一次約 20 MB，之後會快很多");
  const fileset = await FilesetResolver.forVisionTasks(new URL("./wasm", location.href).href);
  let lastErr;
  for (const delegate of ["GPU", "CPU"]) {
    try {
      landmarker = await PoseLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: new URL("./pose_landmarker_full.task", location.href).href, delegate },
        runningMode: "VIDEO", numPoses: 1, minPoseDetectionConfidence: 0.5, minTrackingConfidence: 0.5,
      });
      window.__delegate = delegate; return;
    } catch (e) { lastErr = e; console.warn("start failed", delegate, e); }
  }
  throw new Error("模型無法啟動：" + (lastErr?.message || lastErr));
}

function detect(tsMs) {
  // 模型要求時間戳記一路遞增：每次新的分析都接在上一次後面
  tsMs += tsBase;
  if (tsMs <= lastTs) tsMs = lastTs + 1;
  lastTs = tsMs;
  const res = landmarker.detectForVideo(video, tsMs);
  return res.landmarks && res.landmarks[0] ? res.landmarks[0] : null;
}
function nextFrame(cb) {
  if ("requestVideoFrameCallback" in HTMLVideoElement.prototype) video.requestVideoFrameCallback((now, meta) => cb(meta.mediaTime));
  else requestAnimationFrame(() => cb(video.currentTime));
}

// ---------- 影片分析 ----------
let analyzer = new Analyzer((r) => { toast(r); if (mode === "live") speak(cueFor(r)); });
let lastMedia = -1;
async function analyzeFile(file) {
  stopLive();
  if (video.src) URL.revokeObjectURL(video.src);
  video.srcObject = null; video.controls = false; video.src = URL.createObjectURL(file);
  $("empty").hidden = true; $("result").hidden = true; $("bar").hidden = false; $("barFill").style.width = "0";
  analyzer.reset(); tsBase = lastTs + 1; lastMedia = -1; mode = "file";
  setStatus("分析中…");
  await new Promise((res, rej) => { video.onloadedmetadata = res; video.onerror = () => rej(new Error("這個影片格式無法播放")); });
  const W = video.videoWidth, H = video.videoHeight;
  $("stage").style.aspectRatio = `${W} / ${H}`;
  // 逐格跳轉（每秒 15 格）：每支手機結果都一樣，不受手機快慢影響
  const FPS = 15, dur = video.duration;
  analyzer.reset(3);
  try { await video.play(); video.pause(); } catch {}  // iOS 需要先播一下才會解碼畫面
  const seekTo = (t) => new Promise((res) => { video.onseeked = () => res(); video.currentTime = t; });
  for (let i = 0; ; i++) {
    const t = i / FPS;
    if (t > dur - 0.02 || mode !== "file") break;
    await seekTo(t);
    if (mode !== "file") return;
    const f = analyzer.push(t, detect(Math.round(t * 1000)), W, H);
    draw(f, W, H); hud(f, analyzer.reps.length);
    $("barFill").style.width = `${Math.min(100, (t / dur) * 100)}%`;
    if (i % 3 === 0) await new Promise((r) => setTimeout(r, 0));
  }
  video.onseeked = null;
  finishFile();
}
function finishFile() {
  if (mode !== "file") return;
  mode = "review"; $("bar").hidden = true;
  renderResult(analyzer.reps);
  setStatus(`分析完成：${analyzer.reps.length} 下。可以重播影片看每一格的骨架。`);
  video.controls = true;
  const frames = analyzer.frames;
  const W = video.videoWidth, H = video.videoHeight;
  const review = () => {
    if (mode !== "review") return;
    const t = video.currentTime; let lo = 0, hi = frames.length - 1;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (frames[m].t <= t) lo = m; else hi = m - 1; }
    const f = frames[lo]; draw(f, W, H); hud(f, analyzer.reps.filter((r) => r.endT <= t).length);
    nextFrame(review);
  };
  video.onseeked = () => { if (mode === "review" && video.paused) { review(); } };
  video.onplay = () => { if (mode === "review") nextFrame(review); };
}

// ---------- 即時鏡頭 ----------
async function startLive() {
  if (!navigator.mediaDevices?.getUserMedia) { setStatus("這個瀏覽器不支援即時鏡頭。請改用「錄影或選擇影片」。", true); return; }
  try {
    liveStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: $("rear").checked ? "environment" : "user", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  } catch (e) {
    setStatus("無法開啟鏡頭。請到「設定 › Safari › 相機」允許使用，或改用「錄影或選擇影片」。", true); return;
  }
  if (video.src) { URL.revokeObjectURL(video.src); video.removeAttribute("src"); }
  video.controls = false; video.srcObject = liveStream; await video.play();
  $("empty").hidden = true; $("result").hidden = true;
  analyzer.reset(); tsBase = lastTs + 1; mode = "live";
  try { await navigator.wakeLock?.request("screen"); } catch {}
  speak("開始");
  $("liveBtn").textContent = "結束並看結果";
  const W = video.videoWidth, H = video.videoHeight; $("stage").style.aspectRatio = `${W} / ${H}`;
  const t0 = performance.now();
  setStatus("即時分析中。做完按「結束並看結果」。");
  const loop = () => {
    if (mode !== "live") return;
    const t = (performance.now() - t0) / 1000;
    const f = analyzer.push(t, detect(Math.round(t * 1000)), W, H);
    draw(f, W, H); hud(f, analyzer.reps.length);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
function stopLive() {
  if (liveStream) { liveStream.getTracks().forEach((t) => t.stop()); liveStream = null; }
  if (mode === "live") { mode = "idle"; renderResult(analyzer.reps); setStatus(`本次完成 ${analyzer.reps.length} 下。`); }
  $("liveBtn").textContent = "即時鏡頭";
}

$("file").addEventListener("change", (e) => { const f = e.target.files[0]; if (f && landmarker) analyzeFile(f).catch((err) => setStatus(err.message, true)); e.target.value = ""; });
$("liveBtn").addEventListener("click", () => { if (!landmarker) return; mode === "live" ? stopLive() : startLive(); });
$("liveBtn").disabled = true;

load().then(() => { $("liveBtn").disabled = false; setStatus("準備好了。錄一段側拍影片，或按「即時鏡頭」邊做邊分析。"); window.__ready = true; })
  .catch((e) => {
    const extra = (window.__problems || []).slice(-2).join("；");
    setStatus("載入失敗：" + (e.message || e) + (extra ? "（" + extra + "）" : "") + "。請截圖給我。", true);
    window.__loadError = String(e);
  });
</script>
